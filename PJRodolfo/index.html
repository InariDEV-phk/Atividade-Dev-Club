<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Money Converter - Rodolfo</title>
</head>
<body>
    <img src="./assets/moneychange.gif" alt="logo" class="logo">
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b>
            <select class = currency-selector>
                <option value="dollar">USD Dólar Americano</option>
                <option value="euro">Euro</option>
            </select>
        </label>
        <label>
            Valor
            <input class="input-currency" placeholder="R$8000">
        </label>
        <button class="convert-button">Converter</button>
        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="moeda-convertendo">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>
            <img src="./assets/Vector.png" alt="flecha" class="arrow-img">
            <div class="currency-box">
                <img src="./assets/usd.png" alt="moeda-convertida" class="cflag">
                <p class="currency">Dólar</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>
    
</body>
<script src="scripts.js"></script>
</html>
